# Pushing a v* tag packages the themes into a .vsix, checks it carries the tag's version and the GPL license, and attaches it to the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vsix:
    name: Package and publish the vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The themes are generated and committed, so packaging needs neither Neovim nor a rebuild.
      - name: Package the vsix
        run: npm run package
      - name: Check version and license
        run: |
          version="${GITHUB_REF_NAME#v}"
          vsix="nvchad-themes-$version.vsix"
          if [ ! -f "$vsix" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package.json version"; ls *.vsix; exit 1
          fi
          unzip -l "$vsix" | grep -q "extension/LICENSE"
          unzip -l "$vsix" | grep -q "extension/THIRD_PARTY_NOTICES.md"
          unzip -p "$vsix" extension/package.json | grep -q '"license": "GPL-3.0-or-later"'
          sha256sum "$vsix" > "$vsix.sha256"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-pushed tag replaces the files of its existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" "$VSIX.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" "$VSIX.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NvChad Themes $VERSION" \
              --generate-notes
          fi
